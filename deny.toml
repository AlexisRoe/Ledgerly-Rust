# cargo-deny: what may be in the dependency tree (CONCEPT §4, "Supply chain"). `just deny` runs all four checks.

[graph]
all-features = true

[advisories]
version = 2
# A yanked version is refused like an advisory: the author withdrew it for a reason.
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licences only. Extend this list only with a reason next to the new entry.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # MIT without the attribution clause, so strictly more permissive than MIT. Comes in with `jsonschema`
    # (borrow-or-share), which only the parity suite uses.
    "MIT-0",
]
confidence-threshold = 0.9
# The list is the policy (plan M1.7), not a record of what the tree happens to contain today.
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are not published.
ignore = true

[bans]
# Two major versions of one crate are worth knowing about, but usually a dependency's choice, not ours.
multiple-versions = "warn"
wildcards = "deny"
# `ledgerly-shared.workspace = true` is a path dependency without a version.
allow-wildcard-paths = true

[sources]
# crates.io only: no other registry, no git dependency.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
