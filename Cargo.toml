[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

# Shared by every crate through `[lints] workspace = true`.
#
# `clippy::indexing_slicing` and `clippy::arithmetic_side_effects` are not listed here: they are denied with
# `#![deny(...)]` at the top of each `domain` module, where untrusted values meet arithmetic (plan M0.1).
# Test code is exempt from the clippy denies through `clippy.toml`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
ledgerly-api = { path = "crates/api" }
ledgerly-audit = { path = "crates/audit" }
ledgerly-expenses = { path = "crates/expenses" }
ledgerly-identity = { path = "crates/identity" }
ledgerly-imports = { path = "crates/imports" }
ledgerly-receipts = { path = "crates/receipts" }
ledgerly-shared = { path = "crates/shared" }
ledgerly-teams = { path = "crates/teams" }

argon2 = "0.6.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["now", "std"] }
jsonschema = { version = "0.61.2", default-features = false }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
proptest = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart"] }
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = "2.1.1"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "postgres", "runtime-tokio", "rust_decimal", "uuid"] }
thiserror = "2.0.21"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "registry", "std"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.29.2", features = ["serde", "v4", "v7"] }
