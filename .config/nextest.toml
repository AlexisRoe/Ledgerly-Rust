# A test that hangs (a server that never shuts down, a request nobody answers) is stopped instead of
# blocking `just verify` forever.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

# MetricsTest compares counters before and after an action, so its tests must not run at the same time.
[test-groups]
serial = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(=owasp_metrics)'
test-group = 'serial'
