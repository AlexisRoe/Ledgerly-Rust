[package]
name = "playground"
version = "0.1.0"
edition = "2024"
publish = false
description = "Hands-on exercises for the Rust-for-TypeScript-developers course in learn/."

# Not part of Ledgerly's workspace. The empty table makes this package a workspace of its own, so cargo does not
# look for it in the root Cargo.toml's `members`.
[workspace]

# Same versions as Ledgerly's root Cargo.toml, so cargo reuses what is already downloaded.
[dependencies]
# Not a Ledgerly dependency: lesson 111 contrasts it with thiserror. Already in Ledgerly's lock file (transitively).
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
